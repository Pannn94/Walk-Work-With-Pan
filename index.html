<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Walk Work With Pan | Hongying Pan</title>
    <style>
        :root {
            --brand-bg: #E3D4C5;
            --brand-brown: #6d4c41; 
            --brand-accent: #a1887f; 
            --white: rgba(255, 255, 255, 0.6); 
        }

        @font-face {
            font-family: 'MyCustomFont'; 
            src: url('myfont.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif;
            margin: 0;
            background-color: var(--brand-bg); 
            color: var(--brand-brown);
            line-height: 1.6;
            transition: background-color 0.3s;
            overflow-x: hidden; 
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%; 
            background: rgba(227, 212, 197, 0.9); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(109, 76, 65, 0.05);
        }

        .logo-area {
            flex: 0 0 45%; 
            display: flex;
            align-items: center;
        }

        .logo-area img {
            width: 100%;
            max-width: 400px; 
            height: auto;
            max-height: 150px; 
            object-fit: contain;
            object-position: left;
            mix-blend-mode: multiply; 
        }

        .nav-right {
            flex: 0 0 55%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-links { display: flex; gap: 10px; }
        .social-icon {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            background: var(--brand-brown); color: var(--brand-bg);
            border-radius: 50%; text-decoration: none;
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: pointer;
        }
        .social-icon:hover { transform: scale(1.1); color: #fff; }
        .icon-mail:hover { background: #ea4335; } 
        .icon-wa:hover { background: #25D366; }
        .icon-in:hover { background: #0077b5; } 
        .icon-ig:hover { background: #E1306C; } 
        .icon-wc:hover { background: #07c160; } 
        .social-icon svg { width: 18px; height: 18px; fill: currentColor; }

        .lang-switch { display: flex; flex-wrap: nowrap; }
        .lang-switch button {
            background: none; border: 1px solid var(--brand-brown);
            color: var(--brand-brown); padding: 5px 12px;
            cursor: pointer; margin-left: 5px; font-size: 0.85rem;
            border-radius: 20px; transition: 0.3s;
            white-space: nowrap;
        }
        .lang-switch button.active { background: var(--brand-brown); color: var(--brand-bg); }

        .hero {
            padding: 60px 10%;
            display: flex; align-items: center; justify-content: space-between;
            gap: 40px; flex-wrap: wrap;
        }

        .hero-text { flex: 1; min-width: 0; }
        .hero-text h1 { 
            font-family: 'MyCustomFont', 'PingFang SC', sans-serif; 
            font-size: 4.5rem; margin: 0; color: var(--brand-brown); letter-spacing: 2px;
            line-height: 1.2;
        }
        .hero-text h2 { font-weight: 300; font-size: 1.5rem; margin: 15px 0 20px; color: var(--brand-accent); }
        .hero-text p { font-size: 1.15rem; max-width: 600px; }

        .profile-wrapper {
            flex: 0 0 280px; height: 280px; border-radius: 50%; padding: 5px; 
            background: linear-gradient(135deg, var(--brand-brown), var(--brand-accent));
            box-shadow: 0 15px 35px rgba(109, 76, 65, 0.15);
            margin: 0 auto; 
        }
        .profile-img {
            width: 100%; height: 100%; border-radius: 50%; 
            object-fit: cover; object-position: center 15%; 
            border: 4px solid var(--brand-bg); box-sizing: border-box;
        }

        .grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 25px; padding: 0 10% 40px; 
        }
        .card {
            background: var(--white); padding: 35px 25px; border-radius: 20px;
            text-align: center; transition: transform 0.3s ease;
            border: 1px solid rgba(109, 76, 65, 0.1); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(109,76,65,0.1); }
        .card h3 { 
            margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid var(--brand-brown);
            display: inline-block; padding-bottom: 8px; margin-bottom: 15px;
        }

        .gallery-section { padding: 40px 10% 40px; text-align: center; }
        .gallery-title {
            font-size: 2rem; color: var(--brand-brown); margin-bottom: 35px;
            font-weight: 300; letter-spacing: 1px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px;
        }
        .gallery-item {
            position: relative; border-radius: 15px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(109, 76, 65, 0.1); aspect-ratio: 4 / 3; 
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
        }
        .gallery-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(109, 76, 65, 0.9); color: var(--brand-bg);
            padding: 15px; transform: translateY(100%); transition: transform 0.3s ease;
            font-size: 0.95rem; text-align: center; font-weight: bold;
        }
        @media (hover: hover) {
            .gallery-item:hover img { transform: scale(1.08); }
            .gallery-item:hover .gallery-caption { transform: translateY(0); }
        }

        /* 底部折叠面板样式 (Accordion Style) */
        .bottom-about-section {
            padding: 0 10% 60px;
        }
        .about-details {
            background: var(--white); 
            border-radius: 20px;
            border: 1px solid rgba(109, 76, 65, 0.2); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            margin: 0 auto;
            max-width: 900px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .about-details summary {
            padding: 25px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--brand-brown);
            cursor: pointer;
            list-style: none; 
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        .about-details summary::-webkit-details-marker {
            display: none; 
        }
        .about-details summary:hover {
            background: rgba(109, 76, 65, 0.05);
        }
        .about-details summary::after {
            content: '+';
            font-size: 1.8rem;
            font-weight: 300;
            transition: transform 0.3s ease;
            line-height: 1;
        }
        .about-details[open] summary::after {
            content: '−'; 
        }
        .about-details-content {
            padding: 10px 40px 40px;
        }
        .about-title, .bio-title {
            font-size: 1.6rem; color: var(--brand-brown); margin-top: 10px; margin-bottom: 15px;
            font-weight: 300; letter-spacing: 1px;
        }
        .about-content, .bio-content {
            font-size: 1.1rem; color: var(--brand-brown);
            text-align: justify; line-height: 1.8; margin-bottom: 30px;
        }
        .about-divider {
            border: 0; height: 1px; background: rgba(109, 76, 65, 0.15); margin: 30px 0;
        }

        footer {
            text-align: center; padding: 50px 20px; background: rgba(109, 76, 65, 0.05); font-size: 0.9rem;
        }
        .footer-social { margin-bottom: 25px; }
        .footer-social a { color: var(--brand-brown); text-decoration: none; transition: color 0.3s; }
        .footer-social a:hover { color: var(--brand-accent); }
        .contact-block { font-weight: bold; margin-top: 15px; line-height: 1.8; }
        .
