<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk Work With Pan | 潘红英</title>
    <style>
        :root {
            var(--brand-bg): #E3D4C5;  
            --brand-bg: #E3D4C5;
            --brand-brown: #6d4c41; 
            --brand-accent: #a1887f; 
            --white: rgba(255, 255, 255, 0.6); 
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif;
            margin: 0;
            background-color: var(--brand-bg); 
            color: var(--brand-brown);
            line-height: 1.6;
            transition: background-color 0.3s;
        }

        /* 顶部导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%; 
            background: rgba(227, 212, 197, 0.85); 
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo 区域 */
        .logo-area {
            flex: 0 0 60%; 
            display: flex;
            align-items: center;
        }

        .logo-area img {
            width: 100%;
            max-width: 480px; 
            height: auto;
            max-height: 200px; 
            object-fit: contain;
            object-position: left;
            mix-blend-mode: multiply; 
        }

        /* 右侧操作区 */
        .nav-right {
            flex: 0 0 40%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        /* 社交媒体图标区 */
        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--brand-brown);
            color: var(--brand-bg);
            border-radius: 50%;
            text-decoration: none;
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: pointer;
        }

        .social-icon:hover {
            transform: scale(1.1);
            color: #fff;
        }

        /* 各平台的专属悬停颜色 */
        .icon-in:hover { background: #0077b5; } /* LinkedIn 蓝 */
        .icon-ig:hover { background: #E1306C; } /* IG 渐变红 */
        .icon-wc:hover { background: #07c160; } /* 微信绿 */

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .lang-switch button {
            background: none;
            border: 1px solid var(--brand-brown);
            color: var(--brand-brown);
            padding: 6px 14px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 0.85rem;
            border-radius: 20px;
            transition: 0.3s;
        }

        .lang-switch button.active {
            background: var(--brand-brown);
            color: var(--brand-bg);
        }

        /* Hero 区域 */
        .hero {
            padding: 60px 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            flex-wrap: wrap;
        }

        .hero-text { flex: 1; min-width: 350px; }
        .hero-text h1 { font-size: 3.5rem; margin: 0; color: var(--brand-brown); }
        .hero-text h2 { font-weight: 300; font-size: 1.5rem; margin: 10px 0 20px; color: var(--brand-accent); }

        /* 头像设计 */
        .profile-wrapper {
            flex: 0 0 280px;
            height: 280px;
            border-radius: 50%;
            padding: 5px; 
            background: linear-gradient(135deg, var(--brand-brown), var(--brand-accent));
            box-shadow: 0 15px 35px rgba(109, 76, 65, 0.15);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%; 
            object-fit: cover; 
            object-position: center 15%; 
            border: 4px solid var(--brand-bg); 
            box-sizing: border-box;
        }

        /* 服务区域 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 10% 80px;
        }

        .card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid rgba(109, 76, 65, 0.1);
            backdrop-filter: blur(5px);
        }

        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(109,76,65,0.1); }
        .card h3 { 
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--brand-brown);
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 60px 20px;
            background: rgba(109, 76, 65, 0.05);
            font-size: 0.95rem;
        }

        .footer-social { margin-bottom: 15px; }
        .footer-social a { color: var(--brand-brown); text-decoration: none; font-weight: bold; transition: color 0.3s ease; }
        .footer-social a:hover { color: #E1306C; }
        .footer-social .wechat-text { font-weight: bold; color: var(--brand-brown); margin-left: 5px; }

        @media (max-width: 900px) {
            .hero { text-align: center; justify-content: center; }
            .logo-area { flex: 0 0 100%; justify-content: center; margin-bottom: 15px; }
            .nav-right { flex: 0 0 100%; justify-content: center; flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

    </div>
</nav>

<script>
const content = {
    zh: {
        name: "潘红英",
        title: "跨文化商务协调专家",
        desc: "社会文化人类学硕士。深谙中欧文化差异，提供中、德、英三语一站式商务解决方案。消除沟通壁垒，让每一次连接都精准高效。",

            {t: "商务翻译", d: "提供中德/中英商务会议交传、合同与技术文档笔译及邮件润色。"},
            {t: "商务接待", d: "全流程陪同：从展会陪同、工厂参观到商务宴请，确保沟通无碍。"},
            {t: "欧洲地陪", d: "德国及欧洲深度在地导览，涵盖景点讲解、交通换乘及紧急事务处理。"},
            {t: "留德咨询", d: "一手留德经验分享：院校申请、签证办理、租房避坑及跨文化适应指导。"}
        ]
    },
    en: {
        name: "Hongying Pan",
        title: "Cross-Cultural Specialist",
        desc: "M.A. in Social and Cultural Anthropology. Expert in Sino-European cultural bridge-building with trilingual precision in business solutions.",
        items: [
            {t: "Translation", d: "Interpretation & translation (ZH/DE/EN) for meetings, contracts, and tech docs."},
            {t: "Business Escort", d: "Full-process support: trade fairs, factory visits, and corporate hospitality."},
            {t: "Local Guiding", d: "In-depth tours in Germany/Europe, logistics, and emergency management."},
            {t: "Consulting", d: "Expert advice on German university applications and cultural integration."}
        ]
    },
    de: {
        name: "Hongying Pan",
        title: "Interkulturelle Koordinatorin",
        desc: "M.A. Sozial- und Kulturanthropologie (FU Berlin). Brückenschlag zwischen China und Europa mit Sprach- und Kulturkompetenz.",
        items: [
            {t: "Dolmetschen", d: "Verhandlungsdolmetschen und Fachübersetzungen (ZH/DE/EN) für Business."},
            {t: "Begleitung", d: "Umfassende Betreuung bei Messen, Werksbesuchen und Geschäftsessen."},
            {t: "Reiseleitung", d: "Exklusive Touren in Deutschland/Europa und professionelles Krisenmanagement."},
            {t: "Studienberatung", d: "Insider-Tipps für Bewerbungen in Deutschland und kulturelle Anpassung."}
        ]
    }
};

function setLang(lang) {
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    document.getElementById('name').innerText = content[lang].name;
    document.getElementById('title').innerText = content[lang].title;
    document.getElementById('desc').innerText = content[lang].desc;

    const grid = document.getElementById('services');
    grid.innerHTML = content[lang].items.map(i => `
        <div class="card">
            <h3>${i.t}</h3>
            <p>${i.d}</p>
        </div>
    `).join('');
}

setLang('zh');
</script>
